[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "causal-explainer"
version = "0.1.0"
description = "Explainability method for black-box image classifiers using spectrum-based fault localization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "eaguaida" },
]
keywords = ["xai", "explainability", "neural-networks", "fault-localization", "saliency-maps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "Pillow>=9.4",
    "ipywidgets>=8.0",
    "scipy>=1.10",
]

[project.scripts]
causal-explainer = "causal_explainer.explainer:main"

[project.urls]
Repository = "https://github.com/eaguaida/causal-explainer"

[tool.setuptools.packages.find]
include = ["causal_explainer*"]

[tool.setuptools.package-data]
causal_explainer = ["synset_words.txt"]
